
{% load static %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">{{ titre }}</h1>
          </div><!-- /.col -->
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item active">{{user.get_affectation_display}}</li>
              <li class="breadcrumb-item active">{{ titre|slice:':13' }}...</li>
            </ol>
          </div><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row g-2">
          <div class="col-md-6">
            <form  method="post" id="form-1">
              {% csrf_token %}
                <div class="card card-secondary">
                  <div class="card-header">
                    <h3 class="card-title">SERVICES</h3>
                  </div>
                  <div class="card-body row">
                    <div class="form-group col-md-12">
                      <label for="designation_s">Désignation</label>
                      <input type="text" class="form-control" id="designation_s">
                    </div>
                    <div class="form-group col-md-12">
                      <label for="departement">Département concerné</label>
                      <select name="" id="departement" class="form-control form-control-border">
                        {% for dep in departements %}
                        <option value="{{dep.id}}">{{dep.designation}}</option>
                        {% endfor %}                                  
                    </select> 
                    </div>
                    <div class="form-group col-md-6">
                      <button type="submit" class="btn btn-primary col-10" id="ajouter">Ajouter ce service</button>
                    </div>
                    <div class="form-group col-md-12">
                        <select name="" id="select-form1" class="form-control form-control-border">
                            <option selected disabled>sélectionnez un Service</option>
                            {% for serv in services %}
                            <option value="{{serv.id}}">{{serv.designation}}</option>
                            {% endfor %}                                  
                        </select> 
                        <button type="button" class="btn btn-outline-danger mt-2" id="btn-supprimer1">Supprimer</button>
                        <button type="button" class="btn btn-outline-primary mt-2" id="btn-modifier1">Modifier</button>
                    </div>
                  </div>
                </div>
            </form>
          </div>
          <!-- /.col -->
          <div class="col-md-6">
            <form  method="post" id="form-2">
              {% csrf_token %}
                <div class="card card-secondary">
                  <div class="card-header">
                    <h3 class="card-title">DEPARTEMENT</h3>
                  </div>
                  <div class="card-body row">
                    <div class="form-group col-md-12">
                      <label for="designation_d">Désignation</label>
                      <input type="text" class="form-control" id="designation_d">
                    </div>
                    <div class="form-group col-md-6">
                      <button type="submit" class="btn btn-primary col-10">Ajouter ce département</button>
                    </div>
                    
                    <div class="form-group col-md-12">
                        <select name="" id="select-form2" class="form-control form-control-border">
                            <option selected disabled>sélectionnez un département</option>
                            {% for dep in departements %}
                            <option value="{{dep.id}}">{{dep.designation}}</option>
                            {% endfor %}                                  
                        </select> 
                        <button type="button" class="btn btn-outline-danger mt-2" id="btn-stock-supprimer2">Supprimer</button>
                        <button type="button" class="btn btn-outline-primary mt-2" id="btn-stock-modifier2">Modifier</button>
                    </div>
                  </div>
                </div>
            </form>
          </div>
          <!-- /.col -->
        </div>
        <!-- /.row -->
      </div><!--/. container-fluid -->
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->


{% include 'riviera/formulaires/modal.html' %}
{% include 'riviera/bases/CrudAjax/departement.html' %}
