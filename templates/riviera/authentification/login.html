{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RivieraSOFT | Connexion</title>

  <!-- Google Font: Source Sans Pro -->
  {% comment %} <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback"> {% endcomment %}
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
  <!-- icheck bootstrap -->
  <link rel="stylesheet" href="{% static 'plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <!-- /.login-logo -->
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <img src="{% static 'dist/img/logo-hnr.png' %}" alt="" class="col-12">
      <a href="#" class="h3 display-4">Rivi-SOFT</a>
      <h3>Connexion</h3>
    </div>
    <div class="card-body">

      <form action="{% url 'login' %}" method="post">
        
        {% if messages %}
          
          {% for msg in messages %}
            <div class="alert alert-danger">{{msg}}</div>
          {% endfor %}
            
        {% endif %}
          
        {% csrf_token %}
        <div class="input-group mb-3">
          <input type="text" class="form-control" name="username" placeholder="nom d'utilisateur" autocomplete="off"
          {% if username %}
          value="{{username}}"
          {% endif %}
           >
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-user"></span>
            </div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input type="password" class="form-control" name="password" placeholder="Mot de passe" autocomplete="off">
          <div class="input-group-append" id="hide_show">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
          </div>
          <!-- /.col -->
        </div>
      </form>
      <p>
        <a href="{% url 'change_password' %}" target="_top">Changer votre mot de passe</a>
      </p>
    </div>
    <!-- /.card-body -->
  </div>
  <!-- /.card -->
</div>
<!-- /.login-box -->
<!-- jQuery -->
<script src="{%static 'plugins/jquery/jquery.min.js'%}"></script>
<!-- Bootstrap 4 -->
<script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<!-- AdminLTE App -->
<script src="{% static 'dist/js/adminlte.min.js' %}"></script>
</body>
</html>




<script>
  $("#hide_show").click(function(e){
    if($("[name=password]").attr('type')==='password'){
      $("[name=password]").attr('type','text');
    }else{
      $("[name=password]").attr('type','password')
    }
  })
</script>
